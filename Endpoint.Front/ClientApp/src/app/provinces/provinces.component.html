<div class="card">
  <div class="card-header colorPurple">
    <div class="card-title">
      <span>
        <strong>لیست استان ها</strong>
      </span>
      <a class="btn btn-warning float-end" *ngIf="getAccess('AddProvince')" [routerLink]="['/addProvince']">جدید</a>
    </div>
  </div>
  <div class="card-body">
  <div class="row col-md-12">
    <div class="col-md-4">
      <span>کشور: </span>
      <select class="form-select" [(ngModel)]="countryId" name="countryId" (change)="getData();">
        <option selected="selected">کشور را انتخاب نمایید</option>
        <option *ngFor="let a of countries" value="{{a.id}}">
          {{a.name}}
        </option>
      </select>
    </div>
  </div>
  <br />

   
   

    <div class="table-responsive">

      <table class="table align-middle table-bordered text-center table-striped">
        <thead class="fw-bold table-success">
          <tr>
            <td>#</td>
            <td>
              نام
            </td>
            <td>
              ترتیب نمایش
            </td>

            <td>
            </td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items?.data; index as i">
            <td>{{i+1}}</td>
            <td>
              {{item.name}}
            </td>
            <td>
              {{item.order}}
            </td>

            <td>
              <a class="btn btn-warning m-1" *ngIf="getAccess('UpdateProvince')" [routerLink]="['/editProvince',item.id]">ویرایش</a>
              <a class="btn btn-danger m-1" *ngIf="getAccess('DeleteProvince')" (click)="showDeleteDialog(item.id)">حذف</a>

              <!--<a class="btn btn-info m-1" *ngIf="getAccess('ChangeUserAccess')" [routerLink]="['/useraccess',item.id]">دسترسی</a>-->
            </td>
          </tr>
        </tbody>
      </table>

      <!--<nav dir="ltr">
      <ul class="pagination">
        <li class="page-item" style="cursor:pointer" [class.disabled]="admins?.data?.paging?.page==1" (click)="dec()">
          <span class="page-link colorDarkest">صفحه قبل</span>
        </li>
        <li class="page-item active" aria-current="page">
          <input type="number" class="form-control text-center" style="width:150px;" (change)="change()" [(ngModel)]="req.pageNumber" />
        </li>

        <li class="page-item">
          <a class="page-link" style="cursor:pointer" [class.disabled]="req!.pageNumber! == pageCount" (click)="inc()">صفحه بعد</a>
        </li>
      </ul>
    </nav>
    <span>صفحه {{req.pageNumber}} از {{pageCount}}</span>-->

    </div>
  </div>
</div>



<div class="modal fade" [class.show]="deleteDialog==true" id="exampleModalLive" aria-labelledby="exampleModalLiveLabel" aria-hidden="true" tabindex="-1" [style.display]="deleteDialog==true ? 'block' : null" style="padding-left: 0px;">
  <div class="modal-dialog model-sm">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h1 class="modal-title fs-5" id="exampleModalLiveLabel">پیام سیستم!</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="showDeleteDialog()"></button>
      </div>
      <div class="modal-body">
        <p>از حذف استان مورد نظر مطمئنید؟</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="showDeleteDialog()">انصراف</button>
        <button type="button" class="btn btn-danger" (click)="deleteProvince()">بله</button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="deleteDialog==true" class="modal-backdrop fade show"></div>
