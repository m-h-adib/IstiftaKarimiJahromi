<div class="card">
  <div class="card-header colorPurple">
    <div class="card-title">
      <span>
        <strong>لیست سوالات نیاز به تحقیق</strong>
      </span>
    </div>
  </div>
  <div class="card-body">
    <div class="row col-md-12">
      <div class="col-md-4">
        <form class="row row-cols-lg-auto g-3 align-items-center">
          <div class="col-12">
            <label class="visually-hidden" for="inlineFormInputGroupUsername">عنوان سوال</label>
            <div class="input-group">
              <div class="input-group-text">عنوان سوال</div>
              <input type="text" class="form-control" [(ngModel)]="req.title" name="req.title" id="inlineFormInputGroupUsername" placeholder="....">
            </div>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary" (click)="getData()">جستجو</button>
          </div>
        </form>
      </div>
    </div>
    <br />




    <div class="table-responsive">

      <table class="table align-middle table-bordered text-center table-striped">
        <thead class="fw-bold table-success">
          <tr>
            <td>#</td>
            <td>
              عنوان سوال
            </td>
            <td>
              تاریخ ثبت
            </td>
            <td>
              نام
            </td>
            <td>
              دسته سوال
            </td>
            <td>
              وضعیت سوال
            </td>
            <td>
            </td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items; index as i">
            <td>
              {{((req.pageNumber!-1)*req.pageSize!)+i+1}}
            </td>
            <td>
              {{item.title}}
            </td>
            <td>
              {{item.questionDate}}
            </td>
            <td>
              {{item.name}}
            </td>
            <td>
              {{item.category}}
            </td>
            <td>
                {{item.status}}
            </td>
            <td>
              <swal #aa confirmButtonText="بستن">

                <QuestionPopupComponent *swalPortal="undefined" [questionId]="item.id!"></QuestionPopupComponent>
              </swal>

              <a [swal]="aa" class="btn btn-warning m-1">سوال</a>
              <a class="btn btn-info m-1" *ngIf="getAccess('AddResearchQuestion')"  [routerLink]="['/researchCycles/'+item.id]">تحقیق سوال</a>
              <!--<a class="btn btn-info m-1" *ngIf="getAccess('ReferenceToProcessor')" (click)="showRefrenceDialog(item.id)">ارجاع به پردازشگر</a>-->
            </td>
          </tr>
        </tbody>
      </table>

      <nav dir="ltr">
        <ul class="pagination">
          <li class="page-item" style="cursor:pointer">
            <span class="page-link colorDarkest" [class.disabled]="req.pageNumber==1" (click)="dec()">صفحه قبل</span>
          </li>
          <li class="page-item active" aria-current="page">
            <input type="number" class="form-control text-center" style="width:150px;" (change)="change()" [(ngModel)]="req.pageNumber" />
          </li>

          <li class="page-item" style="cursor:pointer">
            <a class="page-link" [class.disabled]="req!.pageNumber! == pageCount" (click)="inc()">صفحه بعد</a>
          </li>
        </ul>
      </nav>
      <span>صفحه {{req.pageNumber}} از {{pageCount}}</span>

    </div>
  </div>
</div>
