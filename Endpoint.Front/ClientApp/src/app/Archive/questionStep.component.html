<div class="card">
    <div class="card-header colorPurple">
        <div class="card-title">
          <strong>مراحل سوال</strong>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">

            <table class="table align-middle table-bordered text-center table-striped">
              <thead class="fw-bold table-success">
                <tr>
                  <td>
                    از مرحله
                  </td>
                  <td>
                    به مرحله
                  </td>
                  <td>
                    توضیحات
                  </td>
                  <td>
                    تاریخ
                  </td>
                  <td>
                      از کاربر
                  </td>
                  <td>
                      به کاربر
                  </td>
                  <td>
                      تایید کننده
                  </td>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of steps">
                    <td>
                      {{item.fromStep}}
                    </td>
                    <td>
                      {{item.toStep}}
                    </td>
                    <td>
                      {{item.description}}
                    </td>
                    <td>
                      {{item.date}}
                    </td>
                  
                    <td>
                     {{item.fromUser}}
                    </td>
                    <td>
                        {{item.toUser}}
                    </td>
                    <td>
                        {{item.createUser}}
                    </td>
                  </tr>
              </tbody>
            </table>
    </div>
</div>
