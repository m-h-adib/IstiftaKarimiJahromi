<div class="card">
    <div class="card-header colorPurple">
        <div class="card-title">
          <strong>نتیجه سوال</strong>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">

            <table class="table align-middle table-bordered text-center table-striped">
              <thead class="fw-bold table-success">
                <tr>
                  <td>
                    زبان
                  </td>
                  <td>
                    جواب
                  </td>
                  <td>
                    دلیل
                  </td>
                  <td>
                    توضیحات
                  </td>
                  <td>
                      تاریخ
                  </td>
                  <td>
                      ویراستار
                  </td>
                  
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of results">
                    <td>
                      {{item.language}}
                    </td>
                    <td>
                      {{item.answer}}
                    </td>
                    <td>
                      {{item.reason}}
                    </td>
                    <td>
                      {{item.description}}
                    </td>
                  
                    <td>
                     {{item.date}}
                    </td>
                    <td>
                        {{item.editorUser}}
                    </td>
                  </tr>
              </tbody>
            </table>
    </div>
</div>
