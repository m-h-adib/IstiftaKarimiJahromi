<div class="card">
    <div class="card-header colorPurple">
      <div class="card-title">
        <span>
          <strong>آرشیو سوالات</strong>
        </span>
        <!--<a class="btn btn-warning float-end" *ngIf="getAccess('Get')" [routerLink]="['/adduser']">جدید</a>-->
      </div>
    </div>
    <div class="card-body">
      <div class="row">
           <div class="col-4">
               <div class="card">
                   <div class="card-body">
                    <form class="row">
                        <div class="row">
                            <div class="col-md-12">
                                <label for="inputEmail4" class="form-label">دسته سوال</label>
                                <input class="btn form-control" [ngClass]="catName!='دسته سوال' ? 'btn-success' : 'btn-warning'" type="button" value="{{catName}}" (click)="showCatDialog()" />
                                <input hidden="hidden" type="text" class="form-control" [(ngModel)]="Filter.QuestionCategoryId" name="Filter.QuestionCategoryId" placeholder="دسته سوال" />
                              </div>
                        </div>
                        <div class="row">
                        <div class="col">
                            <label for="Title" class="form-label">عنوان سوال</label>
                            <input type="text" class="form-control"  [(ngModel)]="Filter.Title" name="Filter.Title" id="Title" placeholder="عنوان سوال را بنویسید...">
                        </div>
                    </div>
                        <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="FromDate" class="form-label">از تاریخ</label>
                                <ng-persian-datepicker [dateInitValue]="false">
                                    <input type="text" [formControl]="dateValue" [(ngModel)]="Filter.FromDate" name="FromDate" id="FromDate" required class="form-control" placeholder="از تاریخ" />
                                  </ng-persian-datepicker>
                            </div>
                            <div class="col">
                                <label for="ToDate" class="form-label">تا تاریخ</label>
                                <ng-persian-datepicker [dateInitValue]="false">
                                    <input type="text" [formControl]="dateValue2" [(ngModel)]="Filter.ToDate" name="ToDate" id="ToDate" required class="form-control" placeholder="از تاریخ" />
                                  </ng-persian-datepicker>
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="FirstName" class="form-label">نام</label>
                              <input type="text" class="form-control"  [(ngModel)]="Filter.FirstName" name="Filter.FirstName" id="FirstName" placeholder="نام">
                            </div>
                            <div class="col">
                                <label for="LastName" class="form-label">نام خانوادگی</label>
                              <input type="text" class="form-control" id="LastName"  [(ngModel)]="Filter.LastName" name="Filter.LastName" placeholder="نام خانوادگی" aria-label="Last name">
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="FromAge" class="form-label">از سن</label>
                              <input type="number" class="form-control" id="FromAge"  [(ngModel)]="Filter.FromAge" name="Filter.FromAge" placeholder="از سن" aria-label="First name">
                            </div>
                            <div class="col">
                                <label for="ToAge" class="form-label">تا سن</label>
                              <input type="number" class="form-control" id="ToAge"  [(ngModel)]="Filter.ToAge" name="Filter.ToAge" placeholder="تا سن" aria-label="Last name">
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="CountryId" class="form-label">کشور</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="CountryId"  [(ngModel)]="Filter.CountryId" name="Filter.CountryId" (change)="changeCountry()">
                                    <option value="">انتخاب کنید</option>
                                    <option *ngFor="let a of Countries" value="{{a.id}}">
                                        {{a.name}}
                                      </option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="ProvinceId" class="form-label">استان</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="ProvinceId"  [(ngModel)]="Filter.ProvinceId" name="Filter.ProvinceId">
                                    <option>انتخاب کنید</option>
                                    <option *ngFor="let a of Provinces" value="{{a.id}}">
                                        {{a.name}}
                                      </option>
                                </select>
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="City" class="form-label">شهر</label>
                              <input type="text" class="form-control" id="City" [(ngModel)]="Filter.City" name="Filter.City" placeholder="شهر" >
                            </div>
                            <div class="col">
                                <label for="Gender" class="form-label">جنسیت</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="Gender"  [(ngModel)]="Filter.Gender" name="Filter.Gender">
                                    <option>انتخاب کنید</option>
                                    <option value="1" ng-reflect-value="1">آقا</option>
                                    <option value="2" ng-reflect-value="2">خانم</option>
                                </select>
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="Education" class="form-label">تحصیلات</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="Education"  [(ngModel)]="Filter.Education" name="Filter.Education">
                                    <option>انتخاب کنید</option>
                                    <option value="1" ng-reflect-value="1">بی سواد</option>
                                    <option value="2" ng-reflect-value="2">ابتدایی</option>
                                    <option value="3" ng-reflect-value="3">سیکل</option>
                                    <option value="4" ng-reflect-value="4">دیپلم</option>
                                    <option value="5" ng-reflect-value="5">فوق دیپلم</option>
                                    <option value="6" ng-reflect-value="6">کارشناسی</option>
                                    <option value="7" ng-reflect-value="7">کارشناسی ارشد</option>
                                    <option value="8" ng-reflect-value="8">دکتری</option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="JobCategoryId" class="form-label">دسته شغلی</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="JobCategoryId"  [(ngModel)]="Filter.JobCategoryId" name="Filter.JobCategoryId">
                                    <option>انتخاب کنید</option>
                                    <option *ngFor="let a of Jobs" value="{{a.id}}">
                                        {{a.name}}
                                      </option>
                                </select>
                            </div>
                          </div>
                          <div class="row" style="margin-top: 10px;">
                            <div class="col">
                                <label for="Mobile" class="form-label">شماره همراه</label>
                              <input type="text" class="form-control" id="Mobile" placeholder="شماره همراه" aria-label="First name"  [(ngModel)]="Filter.Mobile" name="Filter.Mobile">
                            </div>
                            <div class="col">
                                <label for="MethodOfReceiveQuestionId" class="form-label">روش دریافت سوال</label>
                                <select class="form-select ng-pristine ng-valid ng-touched" id="MethodOfReceiveQuestionId"  [(ngModel)]="Filter.MethodOfReceiveQuestionId" name="Filter.MethodOfReceiveQuestionId">
                                    <option>انتخاب کنید</option>
                                    <option *ngFor="let a of Methods" value="{{a.id}}">
                                        {{a.name}}
                                      </option>
                                </select>
                            </div>
                          </div>
                          <div class="col-12" style="margin-top: 10px;">
                            <button class="btn btn-primary" (click)="search()">جستجو</button>
                          </div>
                    </form>
                   </div>
               </div>
           
           </div>
           <div class="col-8">
               <div class="card">
                   <div class="card-body">
                    <div class="table-responsive">

                        <table class="table align-middle table-bordered text-center">
                          <thead class="fw-bold">
                            <tr>
                              <td>
                                عنوان سوال
                              </td>
                              <td>
                                تاریخ ثبت
                              </td>
                              <td>
                                نام
                              </td>
                              <td>
                                دسته سوال
                              </td>
                              <td>
                              </td>
                            </tr>
                          </thead>
                          <tbody>
                            <tr *ngFor="let item of Questions">
                                <td>
                                  {{item.title}}
                                </td>
                                <td>
                                  {{item.questionDate}}
                                </td>
                                <td>
                                  {{item.name}}
                                </td>
                                <td>
                                  {{item.questionCategory}}
                                </td>
                              
                                <td>
                                  <!--<a class="btn btn-info m-1" *ngIf="getAccess('ReferenceToProcessor')" (click)="showRefrenceDialog(item.id)">ارجاع به پردازشگر</a>
                                  <a class="btn btn-warning m-1" *ngIf="getAccess('UpdateQuestion')" [routerLink]="['/editquestion',item.id]">ویرایش</a>
                                  <a class="btn btn-danger m-1" *ngIf="getAccess('DeleteQuestion')" (click)="showDeleteDialog(item.id)">حذف</a>-->
                    
                                  <!--<a class="btn btn-info m-1" *ngIf="getAccess('ChangeUserAccess')" [routerLink]="['/useraccess',item.id]">دسترسی</a>-->
                                </td>
                              </tr>
                          </tbody>
                        </table>
                  
                   </div>
               </div>
           </div>
      </div>

   </div>
</div>



<div class="modal fade" [class.show]="catDialog==true" id="exampleModalLive" aria-labelledby="exampleModalLiveLabel" aria-hidden="true" tabindex="-1" [style.display]="catDialog==true ? 'block' : null" style="padding-left: 0px;">
    <div class="modal-dialog model-sm">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h1 class="modal-title fs-5" id="exampleModalLiveLabel">پیام سیستم!</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="showCatDialog()"></button>
        </div>
        <div class="modal-body">
          <question-view [tree]="myTree" [showEditDelete]="false" (newItemEvent)="selectCat($event)"></question-view>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="showCatDialog()">انصراف</button>
          <button type="button" class="btn btn-danger" (click)="selectCategory()">انتخاب</button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="catDialog==true" class="modal-backdrop fade show"></div>
