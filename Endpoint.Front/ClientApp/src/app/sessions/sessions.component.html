<div class="card">
    <div class="card-header colorPurple">
      <div class="card-title">
        <span>
          <strong>لیست جلسات</strong>
        </span>
      </div>
    </div>
    <div class="card-body">
    
      <div class="table-responsive">
  
        <table class="table align-middle table-bordered text-center">
          <thead class="fw-bold">
            <tr>
              <td>
                عنوان جلسه
              </td>
              <td>
                تاریخ 
              </td>
              <td>
                ساعت
              </td>
              <td>
                موضوع جلسه (سوال)
              </td>
              <td>
                شرکت کنندگان جلسه
              </td>
              <td>
              </td>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of sessions">
              <td>
                {{item.title}}
              </td>
              <td>
                {{item.date}}
              </td>
              <td>
                {{item.time}}
              </td>
              <td>
                {{item.question}}
              </td>
              <td>
                  <p *ngFor="let a of item.users">
                    {{a}}
                  </p>
              </td>
              <td>
                <!--<a class="btn btn-info m-1" [routerLink]="['/researchCycles/'+item.id]">تحقیق سوال</a>-->
                <!--<a class="btn btn-info m-1" *ngIf="getAccess('ReferenceToProcessor')" (click)="showRefrenceDialog(item.id)">ارجاع به پردازشگر</a>-->
              </td>
            </tr>
          </tbody>
        </table>
  
        <nav dir="ltr">
          <ul class="pagination">
            <li class="page-item" style="cursor:pointer">
              <span class="page-link colorDarkest" [class.disabled]="pageNumber==1" (click)="dec()">صفحه قبل</span>
            </li>
            <li class="page-item active" aria-current="page">
              <input type="number" class="form-control text-center" style="width:150px;" (change)="change()" [(ngModel)]="pageNumber" />
            </li>
  
            <li class="page-item" style="cursor:pointer">
              <a class="page-link" [class.disabled]="pageNumber! == pageCount" (click)="inc()">صفحه بعد</a>
            </li>
          </ul>
        </nav>
        <span>صفحه {{pageNumber}} از {{pageCount}}</span>
  
      </div>
    </div>
  </div>
