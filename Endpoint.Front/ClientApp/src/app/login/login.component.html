<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-8">
        <div class="card colorDarkest" style="border-radius: 1rem;">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
              <img src="../../assets/agha.jpg"
                   alt="login form" class="img-fluid" style="border-radius: 0 1rem 1rem 0;" />
            </div>
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">

                <form>

                  <div class="d-flex align-items-center mb-3 pb-1">
                    <i class="fas fa-cubes fa-2x me-3" style="color: #ff6219;"></i>
                    <span class="h3 fw-bold mb-0 text-white">ورود به سامانه استفتائات</span>
                  </div>


                  <div class="form-outline mb-4">
                    <label class="form-label text-white" for="form2Example17">نام کاربری</label>
                    <input type="text" id="form2Example17" placeholder="شماره پرونده" [(ngModel)]="username" name="username" class="form-control form-control-lg" style="font-size:12pt;" />

                  </div>

                  <div class="form-outline mb-4">
                    <label class="form-label text-white" for="form2Example27">رمز عبور</label>
                    <input type="password" id="form2Example27" placeholder="کد ملی" [(ngModel)]="password" name="password" class="form-control form-control-lg" style="font-size:12pt;" />

                  </div>

                  <div class="pt-1 mb-4">
                    <button class="btn btn-dark btn-lg btn-block colorDark" type="button" (click)="Login()">ورود</button>
                  </div>

                  <div *ngIf="Error!=''" class="alert alert-danger">
                    {{Error}}
                  </div>

                </form>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
