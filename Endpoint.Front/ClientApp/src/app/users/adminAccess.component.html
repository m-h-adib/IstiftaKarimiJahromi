<div class="card">
  <div class="card-header" style="background-color:#d6deff">
    <div class="card-title">
      <span>
        <strong>لیست دسترسی ها</strong>
      </span>
    </div>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle table-bordered text-center">
        <thead class="bg-light fw-bold">
          <tr>
            <td>
              گروه
            </td>
            <td>
           زیرگروه
            </td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of access">
            <td>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" [(ngModel)]="item.isAccess" name="item.name" />
                <label class="form-check-label" for="inlineCheckbox1">{{item.title}}</label>
              </div>
            </td>
            <td>
             
              <div class="form-check form-check align-self-right" *ngFor="let a of item.childs">
                <input class="form-check-input" type="checkbox" [(ngModel)]="a.isAccess" name="a.name" />
                <label class="form-check-label float-start" for="inlineCheckbox1">{{a.title}}</label>
                <table class="table table-bordered" *ngIf="a.childs?.length! != 0">
                  <tr>
                    <td>
                      <div *ngFor="let b of a.childs" class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" [(ngModel)]="b.isAccess" name="b.name" />
                        <label class="form-check-label" for="inlineCheckbox1">{{b.title}}</label>
                      </div>
                    </td>
                  </tr>
                </table>
              </div>
             
            </td>
          </tr>
        </tbody>
      </table>

    </div>
    <button class="btn btn-primary" (click)="Save()">ثبت</button>
  </div>
</div>
