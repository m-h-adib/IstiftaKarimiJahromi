<div class="card mb-4">
    <div class="card-header colorPurple">
      <div class="card-title">
        <strong>مشاهده سوال</strong>
      </div>
    </div>
    <div class="card-body">
      <form class="row g-3">
        <div class="col-md-12">
          <label for="inputEmail4" class="form-label">عنوان</label>
          <textarea rows="4" cols="100" type="text" class="form-control" [(ngModel)]="AddDto.title" name="AddDto.title" placeholder="عنوان"></textarea>
        </div>
      
  
        <div class="col-md-12">
          <label for="inputEmail4" class="form-label">دسته سوال</label>
          <input type="text" class="form-control" [(ngModel)]="AddDto.category" name="AddDto.category" placeholder="دسته سوال" />
        </div>
  
     
        <div class="col-md-12">
          <label for="inputEmail4" class="form-label">متن سوال</label>
          <textarea class="form-control" [(ngModel)]="AddDto.question" name="AddDto.question" rows="8" cols="100" placeholder="متن سوال"></textarea>
          <a *ngIf="AddDto.questionFile!='' && AddDto.questionFile!=null" href="http://212.80.18.168:8081/{{AddDto.questionFile}}" target="_blank" class="btn btn-primary">فایل سوال</a>
        </div>
  
        <div class="col-md-12">
          <label for="inputEmail4" class="form-label">پاسخ سوال</label>
          <textarea class="form-control" [(ngModel)]="AddDto.answer" name="AddDto.answer" rows="8" cols="100" placeholder="پاسخ سوال"></textarea>
          <a *ngIf="AddDto.answerFile!='' && AddDto.answerFile!=null" href="http://212.80.18.168:8081/{{AddDto.answerFile}}" target="_blank" class="btn btn-primary">فایل پاسخ</a>
          <br />
          <a *ngIf="AddDto.answerFile2!='' && AddDto.answerFile2!=null" href="http://212.80.18.168:8081/{{AddDto.answerFile2}}" target="_blank" class="btn btn-primary">فایل 2 پاسخ</a>
        </div>

        <div class="col-md-12">
          <label for="inputEmail4" class="form-label">دلیل سوال</label>
          <textarea class="form-control" [(ngModel)]="AddDto.reason" name="AddDto.reason" rows="8" cols="100" placeholder="دلیل سوال"></textarea>
          <a *ngIf="AddDto.reasonFile!='' && AddDto.reasonFile!=null" href="http://212.80.18.168:8081/{{AddDto.reasonFile}}" target="_blank" class="btn btn-primary">فایل دلیل</a><br />
          <a *ngIf="AddDto.reasonFile2!='' && AddDto.reasonFile2!=null" href="http://212.80.18.168:8081/{{AddDto.reasonFile2}}" target="_blank" class="btn btn-primary">فایل 2 دلیل</a>
        </div>


      </form>
    </div>
  </div>
